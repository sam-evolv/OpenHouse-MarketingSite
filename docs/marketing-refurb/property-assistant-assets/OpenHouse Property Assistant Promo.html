<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenHouse Property Assistant — Promo</title>
<link rel="stylesheet" href="assets/tokens.css" />

<link rel="preload" as="image" href="assets/openhouse-logo-stacked.png" />
<link rel="preload" as="image" href="assets/openhouse-mark.png" />
<link rel="preload" as="image" href="assets/openhouse-ai-header.png" />
<link rel="preload" as="image" href="assets/openhouse-ai-centered.png" />

<script src="assets/oh-mark-data.js"></script>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #050505;
    color: #fff;
    font-family: var(--font-sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #root { width: 100%; height: 100%; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }

  /* Typing cursor in the chat input */
  .hocaret {
    display: inline-block;
    width: 2px;
    height: 14px;
    background: #D4AF37;
    margin-left: 2px;
    vertical-align: middle;
    animation: hocaret-blink 0.9s infinite steps(2);
  }
  @keyframes hocaret-blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Shared engine + frame + tweaks -->
<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<!-- Shared Agent components (exposes UserBubble/IntelligenceCard/etc + PhoneCanvas) -->
<script type="text/babel" src="phone-screens.jsx"></script>
<script type="text/babel" src="scenes.jsx"></script>

<!-- Homeowner-specific phone screens + scenes -->
<script type="text/babel" src="homeowner-phone-screens.jsx"></script>
<script type="text/babel" src="homeowner-scenes.jsx"></script>

<!-- Audio + film treatment -->
<script type="text/babel" src="audio-engine.jsx"></script>
<script type="text/babel" src="film-treatment.jsx"></script>

<!-- Homeowner composer -->
<script type="text/babel" src="homeowner-app.jsx"></script>
</body>
</html>
